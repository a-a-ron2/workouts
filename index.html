<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Session Log</title>
<style>
  :root {
    --ink: #1b1b19; --paper: #eeece5; --line: #35342f;
    --steel: #4f6d7a; --steel-dim: #6f8b96; --rust: #a8563a; --gold: #b6862c;
    --mono: 'SF Mono', ui-monospace, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; }
  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .header h1 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; margin: 0; }
  .header .gear { background: none; border: 1px solid #3a3936; color: #a7a49a; border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .status { font-family: var(--mono); font-size: 11px; color: #6b685f; margin-bottom: 14px; }
  .status.ok { color: var(--gold); }
  .status.err { color: var(--rust); }

  .panel { background: #232220; border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .panel label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8f8c80; margin: 10px 0 4px; }
  .panel input { width: 100%; background: var(--ink); border: 1px solid #3a3936; color: var(--paper); font-family: var(--mono); font-size: 13px; padding: 9px 10px; border-radius: 4px; }
  .panel .hint { font-size: 11px; color: #6b685f; margin-top: 4px; line-height: 1.5; }
  .panel .btn.primary { margin-top: 14px; width: 100%; }

  .daytabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .daytab { flex: none; padding: 7px 12px; border-radius: 3px; border: 1px solid #3a3936; background: transparent; color: #a7a49a; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--sans); }
  .daytab.active { background: var(--steel); border-color: var(--steel); color: var(--ink); }

  .exercise { background: #232220; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
  .ex-head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .ex-name { font-size: 14px; font-weight: 600; }
  .ex-target { font-family: var(--mono); font-size: 11px; color: #8f8c80; margin-top: 2px; }
  .ex-signal { font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 2px; white-space: nowrap; }
  .signal-up { background: rgba(182,134,44,0.18); color: var(--gold); border: 1px solid rgba(182,134,44,0.4); }
  .signal-mid { background: rgba(79,109,122,0.18); color: var(--steel-dim); border: 1px solid rgba(79,109,122,0.4); }
  .signal-none { color: #6b685f; }

  .ex-body { padding: 0 14px 14px; border-top: 1px solid var(--line); display: none; }
  .ex-body.open { display: block; }
  .sets { margin: 12px 0 10px; }
  .set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-family: var(--mono); }
  .set-idx { width: 18px; color: #6b685f; font-size: 12px; }
  .set-row input { background: var(--ink); border: 1px solid #3a3936; color: var(--paper); font-family: var(--mono); font-size: 14px; padding: 7px 8px; border-radius: 3px; width: 68px; text-align: center; }
  .set-row .x { color: #6b685f; font-size: 12px; }
  .set-row .rm { margin-left: auto; background: none; border: none; color: #6b685f; font-size: 16px; cursor: pointer; padding: 4px 8px; }

  .row-actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn { font-family: var(--sans); font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 3px; cursor: pointer; border: 1px solid #3a3936; background: transparent; color: #a7a49a; }
  .btn.primary { background: var(--steel); border-color: var(--steel); color: var(--ink); }

  .history { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .history-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b685f; margin-bottom: 6px; }
  .hist-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; padding: 3px 0; color: #a7a49a; }
  .hist-row .d { color: #6b685f; }
  .hist-empty { font-family: var(--mono); font-size: 12px; color: #6b685f; }

  .save-bar { position: sticky; bottom: 0; margin-top: 16px; }
  .savebtn { width: 100%; padding: 13px; background: var(--gold); color: var(--ink); border: none; border-radius: 4px; font-weight: 700; font-size: 13px; text-transform: uppercase; cursor: pointer; }
  .savebtn:disabled { opacity: 0.5; }
  .toast { text-align: center; font-family: var(--mono); font-size: 12px; color: var(--gold); margin-top: 8px; min-height: 16px; }
  .hidden { display: none; }

  .body-panel { background: #232220; border: 1px solid var(--line); border-radius: 6px; padding: 14px; margin-bottom: 16px; }
  .body-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .body-panel-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: #a7a49a; margin: 0; }
  .body-avg { font-family: var(--mono); font-size: 11px; color: var(--steel-dim); }
  .body-inputs { display: flex; gap: 10px; margin-bottom: 10px; }
  .body-field { flex: 1; }
  .body-field label { display: block; font-size: 10px; text-transform: uppercase; color: #6b685f; margin-bottom: 4px; }
  .body-field input { width: 100%; background: var(--ink); border: 1px solid #3a3936; color: var(--paper); font-family: var(--mono); font-size: 14px; padding: 8px; border-radius: 4px; text-align: center; }
  .body-savebtn { width: 100%; padding: 10px; background: var(--steel); color: var(--ink); border: none; border-radius: 4px; font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer; }
  .body-savebtn:disabled { opacity: 0.5; }
  .body-history { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .body-hist-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; padding: 2px 0; color: #a7a49a; }
  .body-hist-row .d { color: #6b685f; }
  .body-toast { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--gold); margin-top: 6px; min-height: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Session Log</h1>
    <button class="gear" id="gearBtn">Settings</button>
  </div>
  <div class="status" id="statusLine">Not connected</div>

  <div class="panel hidden" id="settingsPanel">
    <label>GitHub username</label>
    <input id="cfgOwner" placeholder="e.g. yourusername" />
    <label>Repo name</label>
    <input id="cfgRepo" placeholder="e.g. workout-log" />
    <label>Branch</label>
    <input id="cfgBranch" placeholder="main" value="main" />
    <label>Personal access token</label>
    <input id="cfgToken" type="password" placeholder="github_pat_..." />
    <div class="hint">Use a fine-grained token scoped to only this repo, with Contents: Read and write permission. It's stored only in this browser's local storage — never sent anywhere but api.github.com.</div>
    <button class="btn primary" id="cfgSave">Save &amp; connect</button>
  </div>

  <div class="body-panel">
    <div class="body-panel-head">
      <h2>Body log</h2>
      <span class="body-avg" id="bodyAvg">7-day avg: —</span>
    </div>
    <div class="body-inputs">
      <div class="body-field">
        <label>Weight (kg)</label>
        <input type="number" inputmode="decimal" id="bodyWeight" placeholder="88.0" step="0.1" />
      </div>
      <div class="body-field">
        <label>Body fat %</label>
        <input type="number" inputmode="decimal" id="bodyFat" placeholder="18.5" step="0.1" />
      </div>
    </div>
    <button class="body-savebtn" id="bodySaveBtn">Save today's weigh-in</button>
    <div class="body-toast" id="bodyToast"></div>
    <div class="body-history">
      <div class="history-title">Last entries</div>
      <div id="bodyHistoryList"></div>
    </div>
  </div>

  <div id="daytabs" class="daytabs"></div>
  <div id="exerciseList"></div>

  <div class="save-bar">
    <button class="savebtn" id="saveBtn">Save today's session</button>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const PLAN = {
  "Upper A": [
    { name: "Bench press", range: "3x5-8" },
    { name: "Barbell/chest-supported row", range: "3x8-12" },
    { name: "Incline DB press", range: "2x8-12" },
    { name: "Lat pulldown", range: "2x10-15" },
    { name: "Lateral raise", range: "3x12-20" },
    { name: "Triceps pushdown", range: "2x10-15" },
    { name: "DB curl", range: "2x10-15" },
  ],
  "Lower A": [
    { name: "Squat", range: "3x5-8" },
    { name: "Romanian deadlift", range: "3x8-12" },
    { name: "Leg curl", range: "2x10-15" },
    { name: "Standing calf raise", range: "3x10-15" },
    { name: "Hanging knee raise", range: "3 sets" },
  ],
  "Upper B": [
    { name: "Overhead press", range: "3x5-8" },
    { name: "Weighted pull-up / lat pulldown", range: "3x6-10" },
    { name: "Dip / flat DB press", range: "2x8-12" },
    { name: "Cable row", range: "2x10-15" },
    { name: "Rear delt fly", range: "2x12-20" },
    { name: "Lateral raise", range: "2x12-20" },
    { name: "Curl + triceps", range: "2x10-15" },
  ],
  "Lower B": [
    { name: "Leg press / front squat", range: "3x8-12" },
    { name: "Bulgarian split squat", range: "2x8-12/leg" },
    { name: "Seated leg curl", range: "2x10-15" },
    { name: "Back extension", range: "2x12-15" },
    { name: "Calf raise", range: "3x10-15" },
  ],
  "Fallback (full body)": [
    { name: "Squat", range: "3x5-8" },
    { name: "Bench press", range: "3x5-8" },
    { name: "Row", range: "3x8-12" },
    { name: "Romanian deadlift", range: "2x8-12" },
    { name: "Lat pulldown", range: "2x10-15" },
    { name: "Curl + triceps", range: "2x10-15" },
  ],
};

const LOG_PATH = "workout-log.csv";
const BODY_LOG_PATH = "body-log.csv";
const todayStr = () => new Date().toISOString().slice(0, 10);

let cfg = JSON.parse(localStorage.getItem("wl_cfg") || "null");
let rows = [];      // {date, day, exercise, setIndex, weight, reps}
let sha = null;
let bodyRows = [];  // {date, weight, bodyfat}
let bodySha = null;
let draft = {};      // exercise -> [{weight,reps}]
let expanded = {};
let day = "Upper A";

function el(id) { return document.getElementById(id); }
function setStatus(text, cls) {
  const s = el("statusLine");
  s.textContent = text;
  s.className = "status" + (cls ? " " + cls : "");
}

function rangeBounds(label) {
  const m = label.match(/(\d+)[-](\d+)/);
  if (!m) return null;
  return { lo: parseInt(m[1]), hi: parseInt(m[2]) };
}

function apiHeaders() {
  return {
    "Authorization": "Bearer " + cfg.token,
    "Accept": "application/vnd.github+json",
  };
}

function csvEscape(v) {
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function rowsToCSV(rows) {
  const header = "date,day,exercise,set_index,weight,reps";
  const lines = rows.map(r => [r.date, r.day, r.exercise, r.setIndex, r.weight, r.reps].map(csvEscape).join(","));
  return [header, ...lines].join("\n") + "\n";
}

function parseCSVLine(line) {
  const out = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { out.push(cur); cur = ""; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

function parseCSV(text) {
  const lines = text.split("\n").filter(l => l.trim().length > 0);
  if (lines.length <= 1) return [];
  return lines.slice(1).map(line => {
    const [date, day, exercise, setIndex, weight, reps] = parseCSVLine(line);
    return { date, day, exercise, setIndex: Number(setIndex), weight: Number(weight), reps: Number(reps) };
  });
}

async function fetchCSV() {
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${LOG_PATH}?ref=${cfg.branch}`;
  const res = await fetch(url, { headers: apiHeaders() });
  if (res.status === 404) { rows = []; sha = null; return; }
  if (!res.ok) throw new Error("GitHub API error " + res.status);
  const data = await res.json();
  sha = data.sha;
  const text = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
  rows = parseCSV(text);
}

async function commitCSV(message) {
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${LOG_PATH}`;
  const content = rowsToCSV(rows);
  const b64 = btoa(unescape(encodeURIComponent(content)));
  const body = { message, content: b64, branch: cfg.branch };
  if (sha) body.sha = sha;
  const res = await fetch(url, { method: "PUT", headers: { ...apiHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error("Save failed: " + res.status);
  const data = await res.json();
  sha = data.content.sha;
}

function bodyRowsToCSV(list) {
  const header = "date,weight_kg,bodyfat_pct";
  const lines = list.map(r => [r.date, r.weight, r.bodyfat].map(csvEscape).join(","));
  return [header, ...lines].join("\n") + "\n";
}

function parseBodyCSV(text) {
  const lines = text.split("\n").filter(l => l.trim().length > 0);
  if (lines.length <= 1) return [];
  return lines.slice(1).map(line => {
    const [date, weight, bodyfat] = parseCSVLine(line);
    return { date, weight: weight === "" ? null : Number(weight), bodyfat: bodyfat === "" ? null : Number(bodyfat) };
  });
}

async function fetchBodyCSV() {
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${BODY_LOG_PATH}?ref=${cfg.branch}`;
  const res = await fetch(url, { headers: apiHeaders() });
  if (res.status === 404) { bodyRows = []; bodySha = null; return; }
  if (!res.ok) throw new Error("GitHub API error " + res.status);
  const data = await res.json();
  bodySha = data.sha;
  const text = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
  bodyRows = parseBodyCSV(text);
}

async function commitBodyCSV(message) {
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${BODY_LOG_PATH}`;
  const content = bodyRowsToCSV(bodyRows);
  const b64 = btoa(unescape(encodeURIComponent(content)));
  const body = { message, content: b64, branch: cfg.branch };
  if (bodySha) body.sha = bodySha;
  const res = await fetch(url, { method: "PUT", headers: { ...apiHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error("Save failed: " + res.status);
  const data = await res.json();
  bodySha = data.content.sha;
}

function weeklyAverage() {
  const sorted = [...bodyRows].filter(r => r.weight != null).sort((a,b) => a.date < b.date ? 1 : -1);
  const last7 = sorted.slice(0, 7);
  if (last7.length === 0) return null;
  const sum = last7.reduce((a, r) => a + r.weight, 0);
  return sum / last7.length;
}

function renderBodyLog() {
  const avg = weeklyAverage();
  el("bodyAvg").textContent = avg == null ? "7-day avg: —" : `7-day avg: ${avg.toFixed(1)} kg`;
  const list = el("bodyHistoryList");
  list.innerHTML = "";
  const sorted = [...bodyRows].sort((a,b) => a.date < b.date ? 1 : -1).slice(0, 5);
  if (sorted.length === 0) {
    const e = document.createElement("div"); e.className = "hist-empty"; e.textContent = "Nothing logged yet";
    list.appendChild(e);
  } else {
    sorted.forEach(r => {
      const row = document.createElement("div"); row.className = "body-hist-row";
      const bf = r.bodyfat != null ? ` · ${r.bodyfat}%` : "";
      row.innerHTML = `<span class="d">${r.date}</span><span>${r.weight != null ? r.weight + " kg" : "—"}${bf}</span>`;
      list.appendChild(row);
    });
  }
}

async function saveBody() {
  const btn = el("bodySaveBtn");
  const wVal = el("bodyWeight").value.trim();
  const fVal = el("bodyFat").value.trim();
  if (wVal === "" && fVal === "") { el("bodyToast").textContent = "Enter at least weight or body fat"; setTimeout(() => el("bodyToast").textContent = "", 2500); return; }
  btn.disabled = true;
  const date = todayStr();
  try {
    await fetchBodyCSV();
    bodyRows = bodyRows.filter(r => r.date !== date); // overwrite same-day entry
    bodyRows.push({ date, weight: wVal === "" ? null : Number(wVal), bodyfat: fVal === "" ? null : Number(fVal) });
    await commitBodyCSV("Body log - " + date);
    el("bodyToast").textContent = "Saved - " + date;
    el("bodyWeight").value = ""; el("bodyFat").value = "";
    renderBodyLog();
  } catch (err) {
    el("bodyToast").textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
    setTimeout(() => { el("bodyToast").textContent = ""; }, 3000);
  }
}

function historyFor(exName) {
  const forEx = rows.filter(r => r.exercise === exName);
  const byDate = {};
  forEx.forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
  return Object.keys(byDate).sort().reverse().map(date => ({
    date, sets: byDate[date].sort((a,b) => a.setIndex - b.setIndex)
  }));
}

function signalFor(exName, rangeLabel) {
  const hist = historyFor(exName);
  if (hist.length === 0) return { label: "no history yet", cls: "signal-none" };
  const bounds = rangeBounds(rangeLabel);
  const last = hist[0];
  if (!bounds) return { label: last.sets.length + " sets logged", cls: "signal-mid" };
  const allAtTop = last.sets.every(s => s.reps >= bounds.hi);
  const allAtLeastLow = last.sets.every(s => s.reps >= bounds.lo);
  if (allAtTop) return { label: "up: add 2.5kg next time", cls: "signal-up" };
  if (allAtLeastLow) return { label: "in range - push reps", cls: "signal-mid" };
  return { label: "below range", cls: "signal-none" };
}

function initDraft() {
  draft = {};
  PLAN[day].forEach(ex => { draft[ex.name] = [{weight:"",reps:""},{weight:"",reps:""},{weight:"",reps:""}]; });
}

function renderTabs() {
  const wrap = el("daytabs");
  wrap.innerHTML = "";
  Object.keys(PLAN).forEach(d => {
    const b = document.createElement("button");
    b.className = "daytab" + (d === day ? " active" : "");
    b.textContent = d;
    b.onclick = () => { day = d; initDraft(); render(); };
    wrap.appendChild(b);
  });
}

function renderExercises() {
  const wrap = el("exerciseList");
  wrap.innerHTML = "";
  PLAN[day].forEach(ex => {
    const sig = signalFor(ex.name, ex.range);
    const card = document.createElement("div");
    card.className = "exercise";

    const head = document.createElement("div");
    head.className = "ex-head";
    head.innerHTML = `<div><div class="ex-name">${ex.name}</div><div class="ex-target">${ex.range}</div></div><div class="ex-signal ${sig.cls}">${sig.label}</div>`;
    head.onclick = () => { expanded[ex.name] = !expanded[ex.name]; render(); };
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "ex-body" + (expanded[ex.name] ? " open" : "");

    const setsDiv = document.createElement("div");
    setsDiv.className = "sets";
    (draft[ex.name] || []).forEach((s, idx) => {
      const row = document.createElement("div");
      row.className = "set-row";
      row.innerHTML = `<span class="set-idx">${idx+1}</span>
        <input type="number" inputmode="decimal" placeholder="kg" value="${s.weight}" data-ex="${ex.name}" data-idx="${idx}" data-field="weight" />
        <span class="x">x</span>
        <input type="number" inputmode="numeric" placeholder="reps" value="${s.reps}" data-ex="${ex.name}" data-idx="${idx}" data-field="reps" />
        <button class="rm" data-ex="${ex.name}" data-idx="${idx}">x</button>`;
      setsDiv.appendChild(row);
    });
    body.appendChild(setsDiv);

    const actions = document.createElement("div");
    actions.className = "row-actions";
    const addBtn = document.createElement("button");
    addBtn.className = "btn"; addBtn.textContent = "+ add set";
    addBtn.onclick = () => { draft[ex.name].push({weight:"",reps:""}); render(); };
    actions.appendChild(addBtn);
    body.appendChild(actions);

    const hist = document.createElement("div");
    hist.className = "history";
    const histTitle = document.createElement("div");
    histTitle.className = "history-title"; histTitle.textContent = "Last sessions";
    hist.appendChild(histTitle);
    const h = historyFor(ex.name);
    if (h.length === 0) {
      const e = document.createElement("div"); e.className = "hist-empty"; e.textContent = "Nothing logged yet";
      hist.appendChild(e);
    } else {
      h.slice(0,4).forEach(entry => {
        const r = document.createElement("div"); r.className = "hist-row";
        r.innerHTML = `<span class="d">${entry.date}</span><span>${entry.sets.map(s => s.weight+"x"+s.reps).join("  ")}</span>`;
        hist.appendChild(r);
      });
    }
    body.appendChild(hist);
    card.appendChild(body);
    wrap.appendChild(card);
  });

  wrap.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", (e) => {
      const { ex, idx, field } = e.target.dataset;
      draft[ex][idx][field] = e.target.value;
    });
  });
  wrap.querySelectorAll(".rm").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const { ex, idx } = e.target.dataset;
      draft[ex].splice(Number(idx), 1);
      render();
    });
  });
}

function render() {
  renderTabs();
  renderExercises();
}

async function saveAll() {
  const saveBtn = el("saveBtn");
  saveBtn.disabled = true;
  const date = todayStr();
  try {
    await fetchCSV(); // pull latest before merging, in case of edits elsewhere
    let savedAny = false;
    PLAN[day].forEach(ex => {
      const sets = (draft[ex.name] || []).filter(s => s.weight !== "" && s.reps !== "");
      if (sets.length === 0) return;
      savedAny = true;
      rows = rows.filter(r => !(r.date === date && r.exercise === ex.name)); // overwrite same-day entry
      sets.forEach((s, i) => rows.push({ date, day, exercise: ex.name, setIndex: i+1, weight: Number(s.weight), reps: Number(s.reps) }));
    });
    if (!savedAny) { el("toast").textContent = "Nothing to save - fill in at least one set"; return; }
    await commitCSV("Log " + day + " - " + date);
    el("toast").textContent = "Saved to GitHub - " + date;
    render();
  } catch (err) {
    el("toast").textContent = "Error: " + err.message;
  } finally {
    saveBtn.disabled = false;
    setTimeout(() => { el("toast").textContent = ""; }, 3000);
  }
}

async function connect() {
  cfg = {
    owner: el("cfgOwner").value.trim(),
    repo: el("cfgRepo").value.trim(),
    branch: el("cfgBranch").value.trim() || "main",
    token: el("cfgToken").value.trim(),
  };
  if (!cfg.owner || !cfg.repo || !cfg.token) { setStatus("Fill in all fields", "err"); return; }
  localStorage.setItem("wl_cfg", JSON.stringify(cfg));
  await connectFlow();
}

el("gearBtn").onclick = () => el("settingsPanel").classList.toggle("hidden");
el("cfgSave").onclick = connect;
el("saveBtn").onclick = saveAll;
el("bodySaveBtn").onclick = saveBody;

initDraft();
render();
renderBodyLog();

async function connectFlow() {
  setStatus("Connecting...");
  try {
    await fetchCSV();
    await fetchBodyCSV();
    setStatus(`Connected - ${cfg.owner}/${cfg.repo} (${rows.length} sets, ${bodyRows.length} weigh-ins)`, "ok");
    el("settingsPanel").classList.add("hidden");
    render();
    renderBodyLog();
  } catch (err) {
    setStatus("Reconnect needed: " + err.message, "err");
    el("settingsPanel").classList.remove("hidden");
  }
}

if (cfg) {
  el("cfgOwner").value = cfg.owner || "";
  el("cfgRepo").value = cfg.repo || "";
  el("cfgBranch").value = cfg.branch || "main";
  el("cfgToken").value = cfg.token || "";
  connectFlow();
} else {
  el("settingsPanel").classList.remove("hidden");
  setStatus("Not connected - enter your GitHub details below");
}
</script>
</body>
</html>
